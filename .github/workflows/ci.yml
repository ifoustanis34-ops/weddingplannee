name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgres://wedivo:wedivo@localhost:5432/wedivo
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Create the non-superuser application role (RLS does not apply to superusers)
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -f ../infra/postgres/init-app-role.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - run: ruff check .
      - run: black --check .
      - run: mypy .
      - run: pytest --cov --cov-report=term-missing -m "not perf"
      # Timing budgets of the specification (500 tickets < 3 min), without the coverage tracer.
      # Shared GitHub runners vary in speed (0.3 to 0.45 s per ticket): the result is reported
      # on every run but does not block (decision of 14/11/2026); check it on the server.
      - name: Performance budgets (informative on shared runners)
        run: pytest -m perf
        continue-on-error: true
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev
