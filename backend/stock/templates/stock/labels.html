<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Montserrat; src: url("wedivo-asset:fonts/montserrat-latin-600-normal.woff"); font-weight: 600; }
  @page { size: A4; margin: 10mm 6mm; }
  body { margin: 0; font-family: Montserrat, sans-serif; color: #17153b; }
  .sheet { width: 198mm; }
  .label { display: inline-block; width: 64mm; height: 34mm; margin: 0 1mm 1.5mm 0; box-sizing: border-box;
           border: 0.2mm dashed #c9c5dc; border-radius: 2mm; padding: 2.5mm; position: relative;
           vertical-align: top; overflow: hidden; }
  .qr { position: absolute; left: 2.5mm; top: 2.5mm; width: 29mm; height: 29mm; }
  .qr svg { width: 29mm; height: 29mm; }
  .text { position: absolute; left: 33mm; top: 3mm; right: 2.5mm; }
  .name { font-size: 8.5pt; font-weight: 600; line-height: 1.2; max-height: 16mm; overflow: hidden; }
  .ref { margin-top: 1.5mm; font-size: 10pt; font-weight: 600; letter-spacing: .3pt; }
  .serial { font-size: 8pt; color: #4a4769; }
  .org { position: absolute; left: 33mm; bottom: 2.5mm; right: 2.5mm; font-size: 6.5pt; color: #85829f; }
</style>
</head>
<body>
<div class="sheet">{% for label in labels %}<div class="label">
  <div class="qr">{{ label.qr|safe }}</div>
  <div class="text">
    <div class="name">{{ label.name }}</div>
    <div class="ref">{{ label.reference }}</div>
    {% if label.serial %}<div class="serial">N° {{ label.serial }}</div>{% endif %}
  </div>
  <div class="org">{{ organization }}</div>
</div>{% endfor %}</div>
</body>
</html>
