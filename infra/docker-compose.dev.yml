name: wedivo

x-backend: &backend
  build:
    context: ../backend
    target: dev
  image: wedivo-backend:dev
  env_file: ../.env
  volumes:
    - ../backend:/app
    # Reference images and sample data of the documents (fidelity test, render_sample)
    - ../docs:/docs:ro
    - ../devis:/devis:ro
    - ../billets:/billets:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      # Superuser for administration only; the app uses the `wedivo` role (see init script).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init-app-role.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedivo -d wedivo"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wedivo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wedivo-minio-secret}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data

  api:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    <<: *backend
    command: celery -A config worker -l info -Q default,pdf,emails

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  frontend:
    image: node:22-alpine
    working_dir: /app
    user: "1000:1000"
    # node_modules lives in a container volume: the host copy holds glibc binaries, Alpine needs musl.
    command: sh -c "npm install --prefer-offline --no-audit --no-fund && npm run dev"
    environment:
      HOME: /tmp
      VITE_API_PROXY: http://api:8000
      VITE_HMR_CLIENT_PORT: "8090"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  db-data:
  frontend-node-modules:
  minio-data:
